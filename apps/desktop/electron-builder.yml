appId: studio.narra.desktop
productName: Narra Studio
electronVersion: 43.3.0
asar: true
compression: normal
npmRebuild: false
nodeGypRebuild: false
directories:
  output: ../../release
files:
  - dist/**/*
  - dist-electron/**/*
  - config/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: captcha-extension
    to: captcha-extension
    filter:
      - "**/*"
asarUnpack:
  - node_modules/ffmpeg-static/**/*
  - node_modules/onnxruntime-*/**/*
  - node_modules/sharp/**/*
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: Narra-Studio-${version}-portable-${arch}.${ext}
  signAndEditExecutable: false

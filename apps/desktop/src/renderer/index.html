<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./brand/narra-mark.svg" />
  <title>Narra Studio</title>
  <!-- Google Fonts chỉ load trong dev, production dùng system font -->
  <script>
    if (location.protocol !== 'file:') {
      const l = document.createElement('link')
      l.rel = 'stylesheet'
      l.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap'
      document.head.appendChild(l)
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f8f7fc;
      /* Critical CSS chạy trước src/index.css nên không dùng được var(--font-ui): phải lặp nguyên stack */
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
        'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei',
        'Noto Sans SC', 'Source Han Sans SC', sans-serif;
      overflow: hidden;
      color: #211a2b;
    }

    .app-error-fallback {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #f8f7fc;
    }

    .app-error-fallback section {
      width: min(560px, 100%);
      padding: 28px;
      border: 1px solid #d8d1e2;
      border-radius: 14px;
      background: #ffffff;
    }

    .app-error-fallback__code {
      color: #7c3aed;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .app-error-fallback h1 {
      margin-top: 10px;
      font-size: 24px;
    }

    .app-error-fallback p {
      margin-top: 10px;
      color: #71667e;
      line-height: 1.55;
    }

    .app-error-fallback div {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .app-error-fallback button {
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid #d8d1e2;
      border-radius: 9px;
      background: #f3f0f8;
      color: #51465f;
      cursor: pointer;
    }

    .app-error-fallback button.primary {
      border-color: #7c3aed;
      background: #7c3aed;
      color: #ffffff;
      font-weight: 700;
    }

    .app-error-fallback pre {
      max-height: 110px;
      margin-top: 18px;
      padding: 12px;
      overflow: auto;
      border-radius: 8px;
      background: #f3f0f8;
      color: #b42318;
      white-space: pre-wrap;
      font: 12px/1.5 'JetBrains Mono', monospace;
    }

    /* Completely hidden until CSS ready — no layout, no paint */
    #root {
      height: 100vh;
      display: none;
    }

    #root.css-ready {
      display: block;
      animation: root-fade-in 0.3s ease both;
    }

    @keyframes root-fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* Critical layout inline — prevents jitter on first paint */
    .app {
      display: flex;
      height: 100vh;
      position: relative;
    }

    .sidebar {
      width: 200px;
      background: #ffffff;
      border-right: 1px solid #e8e3ee;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .main-content {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #f8f7fc;
    }

    /* ── Splash Screen ── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #f8f7fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      object-fit: contain;
      animation: splash-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .splash-title {
      font-size: 20px;
      font-weight: 700;
      color: #211a2b;
      letter-spacing: -0.5px;
      animation: splash-fade 0.5s ease 0.15s both;
    }

    .splash-title em {
      font-style: normal;
      color: #8b5cff;
    }

    .splash-bar-wrap {
      width: 160px;
      height: 2px;
      background: #e8e3ee;
      border-radius: 2px;
      overflow: hidden;
      animation: splash-fade 0.4s ease 0.2s both;
    }

    .splash-bar {
      height: 100%;
      width: 0%;
      background: #8b5cff;
      box-shadow: 0 0 10px rgba(139, 92, 255, .38);
      border-radius: 2px;
      animation: splash-progress 1.8s cubic-bezier(0.4, 0, 0.2, 1) 0.2s forwards;
    }

    .splash-sub {
      font-size: 11px;
      color: rgba(139, 92, 255, .52);
      letter-spacing: 0.3px;
      animation: splash-fade 0.4s ease 0.3s both;
    }

    /* Chữ Hán chồng nhau nếu giữ letter-spacing của splash; src/index.css nạp sau nên phải lặp ở đây */
    :lang(zh) .splash-title,
    :lang(zh) .splash-sub {
      letter-spacing: 0;
    }

    @keyframes splash-pop {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes splash-fade {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes splash-progress {
      0% {
        width: 0%;
      }

      40% {
        width: 55%;
      }

      70% {
        width: 78%;
      }

      90% {
        width: 92%;
      }

      100% {
        width: 100%;
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-JlIFz2Wa.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/lucide-BG4Ur802.js">
  <link rel="modulepreload" crossorigin href="./assets/recharts-CJY_liWu.js">
  <link rel="stylesheet" crossorigin href="./assets/index-DNnmb74c.css">
  <link rel="stylesheet" href="./light-theme.css">
</head>

<body>

  <!-- Splash — hiện ngay, tự ẩn khi React mount xong -->
  <div id="splash">
    <img class="splash-logo" src="./brand/narra-mark.svg" alt="" />
    <div class="splash-title"><em>NARRA STUDIO</em></div>
    <div class="splash-bar-wrap">
      <div class="splash-bar"></div>
    </div>
    <div class="splash-sub">Đang khởi động...</div>
  </div>

  <div id="root"></div>

  <script>
    // Ẩn splash khi React render xong + CSS đã load hoàn toàn
    var _splashStart = Date.now()
    function areSheetsReady() {
      try {
        for (var i = 0; i < document.styleSheets.length; i++) {
          var sheet = document.styleSheets[i];
          if (sheet.href) { try { sheet.cssRules; } catch (e) { return false; } }
        }
        return true
      } catch (e) { return false }
    }

    function hideSplash() {
      var root = document.getElementById('root')
      var splash = document.getElementById('splash')
      if (root) root.classList.add('css-ready')
      if (splash && !splash.classList.contains('hidden')) {
        splash.classList.add('hidden')
        setTimeout(function () { splash.remove() }, 450)
      }
    }

    // HARD FALLBACK: ẩn splash sau 3 giây dù gì đi nữa
    setTimeout(hideSplash, 3000)

    const observer = new MutationObserver(() => {
      const root = document.getElementById('root')
      if (root && root.children.length > 0) {
        observer.disconnect()
        var minDelay = Math.max(0, 600 - (Date.now() - _splashStart))
        function revealWhenReady() {
          if (areSheetsReady()) {
            setTimeout(hideSplash, minDelay)
          } else {
            setTimeout(revealWhenReady, 50)
          }
        }
        revealWhenReady()
      }
    })
    observer.observe(document.getElementById('root'), { childList: true, subtree: true })
  </script>
</body>

</html>
